<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>タワーディフェンスゲーム</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <h1>🏰 タワーディフェンス</h1>

  <div id="main-container">
    <!-- ゲームエリア -->
    <div id="game-area">
      <canvas id="gameCanvas" width="600" height="360"></canvas>
    </div>

    <!-- ステータスバー -->
    <div id="status-bar">
      <div class="status-item">
        <span class="status-label">💰 Gold</span>
        <span id="gold-display" class="status-value">100</span>
      </div>
      <div class="status-item">
        <span class="status-label">❤️ HP</span>
        <span id="hp-display" class="status-value">10</span>
      </div>
      <div class="status-item">
        <span class="status-label">🌊 Wave</span>
        <span id="wave-display" class="status-value">1 / 99</span>
      </div>
      <div class="status-item">
        <span class="status-label">⭐ 到達Wave</span>
        <span id="score-display" class="status-value">0</span>
      </div>
    </div>

    <!-- 手札エリア -->
    <div id="hand-section">
      <div id="hand-label">🃏 手札（クリックで選択 → マップに配置）</div>
      <div id="hand-area">
        <!-- カードはJSで動的生成 -->
      </div>
    </div>

    <!-- コントロールエリア -->
    <div id="control-area">
      <button id="btn-start-wave" class="wave-btn">▶ 次のウェーブ開始</button>
      <button id="btn-sell-mode" class="sell-btn">💸 売却モード</button>
      <span class="select-label">速度：</span>
      <button class="speed-btn selected" data-speed="1" onclick="setSpeed(1)">x1</button>
      <button class="speed-btn" data-speed="2" onclick="setSpeed(2)">x2</button>
      <button class="speed-btn" data-speed="4" onclick="setSpeed(4)">x4</button>
      <button class="speed-btn" data-speed="8" onclick="setSpeed(8)">x8</button>
    </div>

    <!-- タワー説明 -->
    <div id="tower-legend">
      <span class="legend-item"><span class="legend-icon">🗼</span>通常 20G</span>
      <span class="legend-item"><span class="legend-icon">💥</span>範囲 30G</span>
      <span class="legend-item"><span class="legend-icon">❄️</span>スロー 25G</span>
      <span class="legend-item"><span class="legend-icon">🎯</span>スナイパー 40G</span>
      <span class="legend-item"><span class="legend-icon">⚡</span>連射 35G</span>
      <span class="legend-item"><span class="legend-icon">🔰</span>サポート 30G</span>
      <span class="legend-item"><span class="legend-icon">💰</span>ゴールド 50G</span>
      <span class="legend-item"><span class="legend-icon">🧱</span>壁 15G</span>
    </div>

    <!-- メッセージ -->
    <div id="message-area"></div>
  </div>

  <!-- ゲームオーバーモーダル -->
  <div id="gameover-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">ゲームオーバー</h2>
      <p id="modal-score"></p>
      <div class="modal-input">
        <label for="player-name">プレイヤー名：</label>
        <input type="text" id="player-name" maxlength="20" placeholder="名前を入力" />
      </div>
      <button id="btn-save-score">スコアを保存</button>
      <button id="btn-show-ranking">ランキングを見る</button>
      <button id="btn-restart">もう一度プレイ</button>
    </div>
  </div>

  <!-- ランキングモーダル -->
  <div id="ranking-modal" class="modal hidden">
    <div class="modal-content">
      <h2>🏆 ランキング</h2>
      <table id="ranking-table">
        <thead>
          <tr><th>順位</th><th>名前</th><th>到達Wave</th><th>日時</th></tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <button id="btn-close-ranking">閉じる</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>
</html>
