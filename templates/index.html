<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tower Defense Game</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>

<body>

  <!-- タイトル -->
  <div id="title-screen">
    <a class="title">Tower Defense Game</a>
    <button id="start-btn">▶ ゲーム開始</button>
  </div>

  <h1>Tower Defense Game</h1>

  <div id="main-container" style="display: none;">
    <!-- ゲームエリア -->
    <div id="game-area">
      <canvas id="gameCanvas" width="600" height="360"></canvas>
    </div>

    <!-- ステータスバー -->
    <div id="status-bar">
      <div class="status-item">
        <span class="status-label">💰 Gold</span>
        <span id="gold-display" class="status-value">100</span>
      </div>
      <div class="status-item">
        <span class="status-label">❤️ HP</span>
        <span id="hp-display" class="status-value">10</span>
      </div>
      <div class="status-item">
        <span class="status-label">🌊 Wave</span>
        <span id="wave-display" class="status-value">1 / 99</span>
      </div>
      <div class="status-item">
        <span class="status-label">⭐ 到達Wave</span>
        <span id="score-display" class="status-value">0</span>
      </div>
    </div>

    <!-- 手札エリア -->
    <div id="hand-section">
      <div id="hand-label">🃏 手札（クリックで選択 → マップに配置）</div>
      <div id="hand-area">
        <!-- カードはJSで動的生成 -->
      </div>
    </div>

    <!-- コントロールエリア -->

    <div id="control-area">
      <!-- 上段 -->
      <div class="control-row top-row">
        <button id="btn-start-wave" class="wave-btn">▶ 次のウェーブ開始</button>
        <button id="btn-sell-mode" class="sell-btn">💸 売却モード</button>
        <button id="btn-auto" class="auto-btn">🔁 AUTO OFF</button>
        <button id="btn-pause" class="pause-btn">⏸ 一時停止</button>
      </div>

      <!-- 下段 -->
      <div class="control-row bottom-row">
        <span class="select-label">速度：</span>
        <button class="speed-btn selected" data-speed="1" onclick="setSpeed(1)">x1</button>
        <button class="speed-btn" data-speed="2" onclick="setSpeed(2)">x2</button>
        <button class="speed-btn" data-speed="4" onclick="setSpeed(4)">x4</button>
        <button class="speed-btn" data-speed="8" onclick="setSpeed(8)">x8</button>
      </div>
    </div>


    <div id="tower-legend">

      <!-- 一覧 -->
      <div id="legend-list" class="legend-grid">

        <!-- ここにカードだけ入れる -->
        <div class="legend-item" data-type="normal">🗼 通常</div>
        <div class="legend-item" data-type="aoe">💥 範囲</div>
        <div class="legend-item" data-type="slow">❄️ スロー</div>
        <div class="legend-item" data-type="sniper">🎯 スナイパー</div>

        <div class="legend-item" data-type="rapid">⚡ 連射</div>
        <div class="legend-item" data-type="support">🔰 サポート</div>
        <div class="legend-item" data-type="gold">💰 金</div>
        <div class="legend-item" data-type="wall">🧱 壁</div>

      </div>

      <!-- ✅ グリッドの外に出す（ここ超重要） -->
      <p id="legend-guide" class="legend-guide">
        --- クリックすると詳細が表示されます ---
      </p>

      <!-- 詳細 -->

      <div id="legend-detail" class="legend-detail hidden">

        <div id="legend-content"></div>

        <button id="legend-back" class="back-btn">
          ◀ 戻る
        </button>

      </div>



      <!-- 詳細表示 -->
      <div id="legend-detail" style="display:none;">
        <button id="legend-back">← 戻る</button>
        <div id="legend-content"></div>
      </div>

    </div>

    <div id="tooltip" class="tooltip"></div>

    <!-- メッセージ -->
    <div id="message-area"></div>
  </div>

  <!-- ゲームオーバーモーダル -->
  <div id="gameover-modal" class="modal hidden">
    <div class="modal-content">
      <h2 id="modal-title">ゲームオーバー</h2>
      <p id="modal-score"></p>
      <div class="modal-input">
        <label for="player-name">プレイヤー名：</label>
        <input type="text" id="player-name" maxlength="20" placeholder="名前を入力" />
      </div>
      <button id="btn-save-score">スコアを保存</button>
      <button id="btn-show-ranking">ランキングを見る</button>
      <button id="btn-restart">もう一度プレイ</button>
    </div>
  </div>

  <!-- ランキングモーダル -->
  <div id="ranking-modal" class="modal hidden">
    <div class="modal-content">
      <h2>🏆 ランキング</h2>
      <table id="ranking-table">
        <thead>
          <tr>
            <th>順位</th>
            <th>名前</th>
            <th>到達Wave</th>
            <th>日時</th>
          </tr>
        </thead>
        <tbody id="ranking-body"></tbody>
      </table>
      <button id="btn-close-ranking">閉じる</button>
    </div>
  </div>

  <script src="{{ url_for('static', filename='game.js') }}"></script>
</body>

</html>
